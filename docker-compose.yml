services:
  amnezia_panel:
    build: .
    container_name: amnezia_panel

    ports:
      - "${APP_PORT:-5000}:5000"

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost', 5000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
